<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89AACC" />
      <stop offset="100%" stop-color="#4E85BF" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(78,133,191,0.2)" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0C0E" stroke="url(#border-grad)" stroke-width="2" />
  
  <!-- Inner Glow Accent -->
  <circle cx="50" cy="14" r="3" fill="#89AACC" opacity="0.9" />

  <!-- Monogram "AB" -->
  <text 
    x="32" 
    y="43" 
    font-family="'Instrument Serif', Georgia, serif" 
    font-size="34" 
    font-style="italic" 
    font-weight="bold" 
    fill="url(#ab-grad)" 
    text-anchor="middle"
    letter-spacing="-1.5"
  >AB</text>
</svg>
